name: Portfolio validation

on:
  push:
    branches: [development, main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-validation-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate portfolio
    runs-on: [self-hosted, Linux, X64, jeremy-portfolio-isolated]
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate and build
        run: |
          npm run check:production
          node --test scripts/verify-production-bundle.test.mjs
          node --test scripts/check-production-environment.test.mjs
          node scripts/verify-production-bundle.mjs
      - name: Package validated production bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          printf '%s\n' "$GITHUB_SHA" > dist/source-commit.txt
          tar -czf portfolio-production.tgz dist
          sha256sum portfolio-production.tgz > portfolio-production.tgz.sha256
      - name: Transfer validated bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: portfolio-production-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            portfolio-production.tgz
            portfolio-production.tgz.sha256
          if-no-files-found: error
          retention-days: 1

  publisher-readiness:
    name: Verify isolated publisher
    runs-on: [self-hosted, Linux, X64, jeremy-portfolio-publisher]
    timeout-minutes: 5
    steps:
      - name: Verify publisher isolation
        run: |
          test "$(id -u)" != 0
          test ! -S /var/run/docker.sock
          test "$(awk '/CapEff/ {print $2}' /proc/self/status)" = 0000000000000000
          node --version

  deploy-production:
    name: Deploy production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'jeremydevv/jeremydevv'
    needs: [validate, publisher-readiness]
    environment:
      name: production
      url: https://jeremy.md
    runs-on: [self-hosted, Linux, X64, jeremy-portfolio-publisher]
    timeout-minutes: 20
    steps:
      - name: Check out approved source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install deployment tools without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Receive validated bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: portfolio-production-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify validated bundle and source
        run: |
          sha256sum --check portfolio-production.tgz.sha256
          tar -xzf portfolio-production.tgz
          test "$(cat dist/source-commit.txt)" = "$GITHUB_SHA"
          node scripts/verify-production-bundle.mjs
          npx wrangler versions upload --config dist/jeremy_portfolio_development/wrangler.json --dry-run
      - name: Verify production environment protection
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-production-environment.mjs
      - name: Check production delivery flag
        env:
          PRODUCTION_DELIVERY_ENABLED: ${{ vars.PRODUCTION_DELIVERY_ENABLED }}
        run: node scripts/check-production-delivery.mjs
      - name: Deploy approved production bundle
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing production Cloudflare token' >&2; exit 1; }
          current_main="$(git ls-remote https://github.com/jeremydevv/jeremydevv.git refs/heads/main | cut -f1)"
          test "$current_main" = "$GITHUB_SHA" || { echo 'Production source is no longer the current main commit' >&2; exit 1; }
          version_tag="gha-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          npx wrangler versions upload --config dist/jeremy_portfolio_development/wrangler.json --tag "$version_tag"
          current_main="$(git ls-remote https://github.com/jeremydevv/jeremydevv.git refs/heads/main | cut -f1)"
          test "$current_main" = "$GITHUB_SHA" || { echo 'Production source changed after upload; version was not deployed' >&2; exit 1; }
          npx wrangler versions deploy --config dist/jeremy_portfolio_development/wrangler.json --version-tag "$version_tag" --percentage 100 --yes
